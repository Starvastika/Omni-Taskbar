name: Build Omni Taskbar stable draft
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: omni-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Require exact tag and intended public repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata=Get-Content version.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -and ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$($metadata.version)")) {throw 'Run only at the exact version tag.'}
          if ($env:GITHUB_REPOSITORY -ne 'Starvastika/Omni-Taskbar' -or $metadata.repository -ne $env:GITHUB_REPOSITORY) {throw 'Wrong publication repository.'}
          $repo=gh api "repos/$env:GITHUB_REPOSITORY" | ConvertFrom-Json
          if ($repo.private) {throw 'Consumer release source must be public.'}
      - name: Verified build dependencies and unit gates
        shell: pwsh
        run: |
          python -m pip install -r time-center/requirements.txt PyYAML==6.0.3
          if ($LASTEXITCODE) {throw 'Developer test dependencies failed.'}
          python -m unittest discover -s shell-updater/tests -v
          if ($LASTEXITCODE) {throw 'Engine tests failed.'}
          python tools/prepare_installer_deps.py
          if ($LASTEXITCODE) {throw 'Verified dependencies failed.'}
          $input=Get-Content distribution/dependencies.json -Raw | ConvertFrom-Json
          $setup=Join-Path $PWD '.validation/omni-installer/deps/innosetup-6.7.3.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne 'Valid') {throw 'Inno publisher signature failed.'}
          $dest=Join-Path $PWD '.validation/omni-installer/inno'
          $process=Start-Process -FilePath $setup -ArgumentList @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$dest+'"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode) {throw 'Inno tool setup failed.'}
      - name: Build full EXE and compact updater with source and privacy gates
        shell: pwsh
        run: |
          ./tools/build_omni_launcher.ps1
          if ($LASTEXITCODE) {throw 'Launcher failed.'}
          ./weather-center/build-launcher.ps1
          if ($LASTEXITCODE) {throw 'Weather launcher failed.'}
          python tools/release_build.py
          if ($LASTEXITCODE) {throw 'Release/source/privacy gates failed.'}
      - name: Build isolated upgrade fixture and test actual installed layout
        shell: pwsh
        run: |
          python tools/build_installer.py --fixture-version 1.0.1
          if ($LASTEXITCODE) {throw 'Upgrade fixture build failed.'}
          python tools/test_installer_matrix.py --setup dist/Omni-Taskbar-Setup-1.0.0.exe --upgrade dist/Omni-Taskbar-Setup-1.0.1.exe --fixture .validation/omni-installer/ci-fixture --shell
          if ($LASTEXITCODE) {throw 'Actual EXE install/repair/update/rollback/upgrade/uninstall gate failed.'}
      - name: Retain private CI diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-diagnostics
          path: .validation/omni-installer/ci-fixture/*.json
          retention-days: 3
      - name: Keep successful preflight artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: omni-taskbar-preflight
          path: |
            dist/Omni-Taskbar-Setup-1.0.0.exe
            dist/omni-taskbar-1.0.0-update.zip
            dist/omni-taskbar-1.0.0-source.zip
            dist/release-manifest.json
            dist/SHA256SUMS.txt
          retention-days: 7
      - name: Upload and independently verify draft assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content version.json -Raw | ConvertFrom-Json).version
          $tag="v$version"
          $assets=@("dist/Omni-Taskbar-Setup-$version.exe","dist/omni-taskbar-$version-update.zip","dist/omni-taskbar-$version-source.zip",'dist/release-manifest.json','dist/SHA256SUMS.txt')
          gh release create $tag @assets --verify-tag --draft --title "Omni Taskbar $version" --notes-file SOURCE_ACCESS.md
          if ($LASTEXITCODE) {throw 'Draft release upload failed.'}
          $download=Join-Path $PWD '.validation/uploaded-release'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh release download $tag --dir $download
          if ($LASTEXITCODE) {throw 'Draft asset download failed.'}
          foreach($line in Get-Content (Join-Path $download 'SHA256SUMS.txt')) {
            $fields=$line -split '  ',2
            if((Get-FileHash -LiteralPath (Join-Path $download $fields[1]) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $fields[0]) {throw 'Uploaded asset checksum mismatch.'}
          }
          # Do not publish automatically. Inspect real run logs and perform the
          # recorded interactive shell matrix before making this stable public.
